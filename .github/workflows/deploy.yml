name: Deploy na Oracle Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH to Oracle Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 163.176.158.165
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            cd ~/recife-por-elas
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
